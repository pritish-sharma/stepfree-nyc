<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StepFree NYC</title>
<meta name="description" content="Accessibility investment intelligence for the NYC subway: which station complexes should be made step-free next.">
<meta name="theme-color" content="#04070a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="dist/app.css">
</head>
<body>
<div class="environment" aria-hidden="true"></div>
<header class="header">
  <div class="brand">
    <div><div class="brand-name">Step<b>Free</b> // NYC</div><div class="brand-sub">Accessibility investment intelligence</div></div>
  </div>
  <nav class="nav" role="tablist" aria-label="Sections">
    <button role="tab" data-view="command" aria-selected="true">Command</button>
    <button role="tab" data-view="validation" aria-selected="false">Validation</button>
    <button role="tab" data-view="explorer" aria-selected="false">Data explorer</button>
    <button role="tab" data-view="method" aria-selected="false">Method</button>
    <span class="nav-indicator" aria-hidden="true"></span>
  </nav>
  <div class="sysinfo">
    <div class="kv"><span class="k">Data</span><span class="v"><span class="dot" style="background:#6b7c86"></span>Historical · Aug–Sep 2025</span></div>

  </div>

<main class="views">
  <section class="view" id="view-command" role="tabpanel" aria-label="Command"></section>
  <section class="view is-hidden" id="view-validation" role="tabpanel" aria-label="Validation"></section>
  <section class="view is-hidden" id="view-explorer" role="tabpanel" aria-label="Data explorer"></section>
  <section class="view is-hidden" id="view-method" role="tabpanel" aria-label="Method"></section>
</main>
<noscript><div class="fatal"><div><b>JavaScript required</b>StepFree NYC runs its optimisation model in the browser.</div></div></noscript>
<script src="data.js"></script>
<script src="dist/app.js"></script>

</html>
